name: Deploy Landing Page

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: optimark-landing-page

jobs:
  build:
    name: Build and Push Image
    timeout-minutes: 60
    # Self-hosted runner installed on the production server.
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="sha-${SHORT_SHA}"
          fi
          echo "name=${REGISTRY}/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:production
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy Production
    timeout-minutes: 60
    runs-on: self-hosted
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.local file from secrets
        run: |
          echo "${{ secrets.ENV_LOCAL }}" > .env.local
          echo "✅ Created .env.local file"

      - name: Set deployment metadata
        id: deploy
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="sha-${SHORT_SHA}"
          fi
          IMAGE_PREFIX="${REGISTRY}/${OWNER_LC}"
          echo "image=${IMAGE_PREFIX}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync compose and env to deploy path
        env:
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          if [[ -z "$PRODUCTION_DEPLOY_PATH" ]]; then
            echo "PRODUCTION_DEPLOY_PATH secret is not set."
            exit 1
          fi
          mkdir -p "$PRODUCTION_DEPLOY_PATH"
          cp docker-compose.yml "$PRODUCTION_DEPLOY_PATH/docker-compose.yml"
          cp .env.local "$PRODUCTION_DEPLOY_PATH/.env.local"

      - name: Pull and restart production container
        env:
          LANDING_PAGE_IMAGE: ${{ steps.deploy.outputs.image }}
          IMAGE_TAG: ${{ steps.deploy.outputs.tag }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$PRODUCTION_DEPLOY_PATH"
          echo "$GHCR_PASSWORD" | docker login "${REGISTRY}" -u "${{ github.actor }}" --password-stdin
          export LANDING_PAGE_IMAGE IMAGE_TAG
          docker compose -f docker-compose.yml pull landing-page
          docker rm -f optimark.landing-page 2>/dev/null || true
          docker compose -f docker-compose.yml up -d --no-build --remove-orphans landing-page
          docker compose -f docker-compose.yml ps landing-page
          docker compose -f docker-compose.yml logs --tail=20 landing-page
