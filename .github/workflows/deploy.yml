name: Deploy Landing Page

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: optimark-landing-page

jobs:
  build:
    name: Build and Push Image
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="sha-${SHORT_SHA}"
          fi
          echo "name=${REGISTRY}/${OWNER_LC}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Public config, needed at build time because the site is statically
          # prerendered. Repository/environment *variables*, not secrets — these
          # end up in the image history and in the shipped HTML either way.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_CLIENT_AREA_URL=${{ vars.NEXT_PUBLIC_CLIENT_AREA_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:production
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: false

  deploy:
    name: Deploy Production
    timeout-minutes: 60
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env.local file from secrets
        run: |
          echo "${{ secrets.ENV_LOCAL }}" > .env.local
          echo "✅ Created .env.local file"

      - name: Set deployment metadata
        id: deploy
        shell: bash
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            SHORT_SHA="${GITHUB_SHA::7}"
            TAG="sha-${SHORT_SHA}"
          fi
          IMAGE_PREFIX="${REGISTRY}/${OWNER_LC}"
          echo "image=${IMAGE_PREFIX}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          PRODUCTION_HOST="$(printf '%s' "$PRODUCTION_HOST" | tr -d '[:space:]')"
          PRODUCTION_PORT="$(printf '%s' "${PRODUCTION_PORT:-22}" | tr -d '[:space:]')"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/production_key
          chmod 600 ~/.ssh/production_key
          ssh-keyscan -p "$PRODUCTION_PORT" "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose and env files
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
        run: |
          PRODUCTION_HOST="$(printf '%s' "$PRODUCTION_HOST" | tr -d '[:space:]')"
          PRODUCTION_USER="$(printf '%s' "$PRODUCTION_USER" | tr -d '[:space:]')"
          PRODUCTION_PORT="$(printf '%s' "${PRODUCTION_PORT:-22}" | tr -d '[:space:]')"
          if [[ ! "$PRODUCTION_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]]; then
            echo "Invalid PRODUCTION_USER. Use only the Linux username, for example: deploy"
            exit 1
          fi
          ssh -i ~/.ssh/production_key -p "$PRODUCTION_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" "mkdir -p '$PRODUCTION_DEPLOY_PATH'"
          scp -i ~/.ssh/production_key -P "$PRODUCTION_PORT" docker-compose.yml "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_DEPLOY_PATH/docker-compose.yml"
          scp -i ~/.ssh/production_key -P "$PRODUCTION_PORT" .env.local "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_DEPLOY_PATH/.env.local"

      - name: Pull and restart production container
        env:
          LANDING_PAGE_IMAGE: ${{ steps.deploy.outputs.image }}
          IMAGE_TAG: ${{ steps.deploy.outputs.tag }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_DEPLOY_PATH: ${{ secrets.PRODUCTION_DEPLOY_PATH }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PRODUCTION_HOST="$(printf '%s' "$PRODUCTION_HOST" | tr -d '[:space:]')"
          PRODUCTION_USER="$(printf '%s' "$PRODUCTION_USER" | tr -d '[:space:]')"
          PRODUCTION_PORT="$(printf '%s' "${PRODUCTION_PORT:-22}" | tr -d '[:space:]')"
          ssh -i ~/.ssh/production_key -p "$PRODUCTION_PORT" "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "set -e \
              && cd '$PRODUCTION_DEPLOY_PATH' \
              && echo '$GHCR_PASSWORD' | docker login ${REGISTRY} -u '${{ github.actor }}' --password-stdin \
              && export LANDING_PAGE_IMAGE='${LANDING_PAGE_IMAGE}' \
              && export IMAGE_TAG='${IMAGE_TAG}' \
              && docker compose -f docker-compose.yml pull landing-page \
              && docker compose -f docker-compose.yml up -d --no-build --remove-orphans landing-page \
              && docker compose -f docker-compose.yml ps landing-page \
              && docker compose -f docker-compose.yml logs --tail=20 landing-page"
