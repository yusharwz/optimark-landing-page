# Local PostgreSQL for development only.
#
#   pnpm db:up       # start
#   pnpm db:migrate  # apply migrations
#   pnpm db:down     # stop (data survives in the named volume)
#
# Production is NOT defined here. docker-compose.yml is what the deploy
# workflow runs on the server, and it is left untouched until the production
# database (new container vs. an existing instance on digimar-network,
# credentials, backups) has been decided.

services:
  postgres:
    image: postgres:17-alpine
    container_name: optimark.landing-page.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: optimark
      POSTGRES_PASSWORD: optimark
      POSTGRES_DB: optimark_landing
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - landing-page-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optimark -d optimark_landing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  landing-page-db:
